server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Cache-Control "no-store" always;

    location /artifactory/libs-release-local/i18n/esignet-i18n-bundle.zip {
        alias /usr/share/nginx/html/artifactory/libs-release-local/i18n/esignet-i18n-bundle.zip;
    }
    location /artifactory/libs-release-local/theme/esignet-theme.zip {
        alias /usr/share/nginx/html/artifactory/libs-release-local/theme/esignet-theme.zip;
    }
    location /artifactory/libs-release-local/image/esignet-image.zip {
        alias /usr/share/nginx/html/artifactory/libs-release-local/image/esignet-image.zip;
    }

    location /locales/ {
        try_files $uri =404;
    }
    location /theme/ {
        try_files $uri =404;
    }
    location /images/ {
        try_files $uri =404;
    }
    location = /logo.png {
        try_files /logo.png =404;
    }

    location / {
        return 404;
    }
}

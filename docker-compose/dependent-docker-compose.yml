services:
  database:
    image: "postgres:bookworm"
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5455}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:6.0
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-16379}:6379"
    restart: always

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:${ZOOKEEPER_HOST_PORT:-12181}:2181"

  kafka:
    image: wurstmeister/kafka
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:${KAFKA_HOST_PORT:-19092}:9092"
      - "${COMPOSE_BIND:-127.0.0.1}:${KAFKA_EXTERNAL_HOST_PORT:-19093}:9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:${KAFKA_EXTERNAL_HOST_PORT:-19093}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  mock-identity-system:
    image: "mosipdev/mock-identity-system:release-0.13.x"
    user: root
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:${MOCK_IDENTITY_HOST_PORT:-8082}:8082"
    environment:
      - container_user=mosip
      - active_profile_env=default,local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MOSIP_ESIGNET_HOST=localhost:8088
    depends_on:
      - database

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_COMPOSE_SUBNET:-198.18.51.0/24}
